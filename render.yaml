services:
  - type: web
    name: board-command
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ALLOWED_EMAIL
        value: cmajeff@gmail.com
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GCP_SECRET_PROJECT_ID
        sync: false
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GCP_TOKEN_SECRET_NAME
        value: board-command-google-oauth
      - key: FLASK_SECRET_KEY
        generateValue: true
